[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dotlinks"
version = "0.1.0"
description = "Check the state of dotfile symlinks and report it as text or JSON"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "stern-cinder583" }]

[tool.setuptools.packages.find]
where = ["src"]
